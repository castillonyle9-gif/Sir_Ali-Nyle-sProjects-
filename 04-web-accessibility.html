<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Wondering Photographer</title>
    <style>
     
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background-color: #ff69b4; 
        font-family: Arial, sans-serif;
        color: #000;
        max-width: 420px;  
        margin: 0 auto;   
      }

      header {
        text-align: center;
        padding: 8px 0 0 0;
      }

      header img.swirl {
        width: 180px;
        display: block;
        margin: 0 auto;
      }

      .cart-icon {
        text-align: right;
        padding: 4px 12px;
        font-size: 1.5em;
      }

      main {
        padding: 0 10px 10px 10px;
      }

      .photo-card {
        margin-bottom: 15px;
      }

      .photo-card img {
        width: 100%;
        display: block;
      }

      .photo-card figcaption {
        background-color: #f5f5dc;
        color: #00ced1;
        font-weight: bold;
        padding: 6px 8px;
        font-size: 0.88em;
        line-height: 1.4;
      }

      .photo-card button {
        display: block;
        margin-top: 3px;
        padding: 3px 8px;
        font-size: 0.82em;
        cursor: pointer;
        background-color: #e0e0e0;
        border: 1px solid #999;
        color: #000;
      }

      .photo-card button:hover,
      .photo-card button:focus {
        background-color: #c8c8c8;
        outline: 2px solid #000; 
      }

      footer {
        padding: 8px 10px;
        font-weight: bold;
        font-size: 0.88em;
      }

      footer nav {
        margin-top: 6px;
      }

      footer nav ul {
        list-style: disc;
        padding-left: 20px;
      }

      footer nav ul li {
        margin-bottom: 3px;
      }

      footer nav ul li a {
        color: blue;
        text-decoration: underline;
      }

      footer nav ul li a:hover,
      footer nav ul li a:focus {
        text-decoration: none;
        outline: 2px solid #000;
      }
    </style>
  </head>
  <body>

    <header>
      <img
        class="swirl"
        src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/05/Ornamental_divider.svg/400px-Ornamental_divider.svg.png"
        alt=""
        role="presentation"
      />
    </header>

    <div class="cart-icon" aria-label="Shopping cart">🛒</div>

    <main>

      <figure class="photo-card">
        <img
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQjEDpO2VnFyZa0eDM9eFckEVToArE_UHUb4hm0bzVOLD7bQR0q"
          alt="A stunning icy coastline in Greenland with turquoise water"
        />
        <figcaption>
          This was from a fabulous trip to the cost of Greenland with my family.
          The water was lovely- but very cold!
        </figcaption>
        <button type="button" aria-label="Add Greenland coast photo to basket">
          Add to basket
        </button>
      </figure>

      <figure class="photo-card">
        <img
          src="https://encrypted-tbn3.gstatic.com/images?q=tbn:ANd9GcTNgxC3jNpE_kIuo6my0cxAoUdi30KXSLiEl4F-i0Qkkh4kyocR"
          alt="Looking up at the red steel structure of the Golden Gate Bridge"
        />
        <figcaption>
          A picture of the Golden Gate Bridge. New York! New York!
        </figcaption>
        <button type="button" aria-label="Add Golden Gate Bridge photo to basket">
          Add to basket
        </button>
      </figure>

      <figure class="photo-card">
        <img
          src="https://encrypted-tbn2.gstatic.com/images?q=tbn:ANd9GcQaPZXksSNhr4BU36O7OF2uSlh0cr-4GLRT7dabw0lBLVKqEs-p"
          alt="A wide glacier river valley surrounded by steep mountains in Greenland"
        />
        <figcaption>
          Another great photo from Greenland. It's a river valley where a
          glacier used to be.
        </figcaption>
        <button type="button" aria-label="Add Greenland river valley photo to basket">
          Add to basket
        </button>
      </figure>

      <figure class="photo-card">
        <img
          src="https://i.ytimg.com/vi/o7rzB8BIY8M/hqdefault.jpg?sqp=-oaymwEmCOADEOgC8quKqQMa8AEB-AH-CYAC0AWKAgwIABABGFEgZSg8MA8=&rs=AOn4CLBMgSTccNkSrJAyS_ebm4I4cJB44A"
          alt="A tall waterfall cascading down green cliffs with mist at the bottom"
        />
        <figcaption>
          The waterfall made such a lovely sound. I could have fallen asleep!
        </figcaption>
        <button type="button" aria-label="Add waterfall photo to basket">
          Add to basket
        </button>
      </figure>

    </main>

    <footer>
      <p>Copyright The Wondering Photographer 2018.</p>
      <nav aria-label="Footer navigation">
        <ul>
          <li><a href="#">Home</a></li>
          <li><a href="#">Blog</a></li>
          <li><a href="#">About me</a></li>
        </ul>
      </nav>
    </footer>

  </body>
</html>
